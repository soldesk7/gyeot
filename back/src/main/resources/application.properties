spring.application.name=gyeot-back

# 이번 범위에서는 공개 배포가 없으므로 local 프로필을 기본으로 켠다.
# 실제 키 값은 application-local.properties(gitignore 처리, 커밋 금지)에 둔다.
spring.profiles.active=local

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Gemini 호출 응답 대기 상한(밀리초). 인식 실패 폴백까지 N-07의 10초 안에 끝나도록 8초로 둔다.
gyeot.gemini.timeout-ms=8000
