spring.application.name=gyeot-back

# 이번 범위에서는 공개 배포가 없으므로 local 프로필을 기본으로 켠다.
# 실제 키 값은 application-local.properties(gitignore 처리, 커밋 금지)에 둔다.
spring.profiles.active=local

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Gemini 호출 응답 대기 상한(밀리초).
# 스파이크 정책 합격선상 20초 초과는 실패로 판정하므로 그 경계를 상한으로 둔다.
# 10초 목표(N-07) 초과 구간은 대기 화면의 수동 선택 유도로 흡수한다.
gyeot.gemini.timeout-ms=20000
