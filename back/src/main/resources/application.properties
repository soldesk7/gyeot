spring.application.name=gyeot-back

# 이번 범위에서는 공개 배포가 없으므로 local 프로필을 기본으로 켠다.
# 실제 키 값은 application-local.properties(gitignore 처리, 커밋 금지)에 둔다.
spring.profiles.active=local

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Gemini 호출 응답 대기 상한(밀리초).
# 스파이크 정책 합격선상 20초 초과는 실패로 판정하므로 그 경계를 상한으로 둔다.
# 10초 목표(N-07) 초과 구간은 대기 화면의 수동 선택 유도로 흡수한다.
gyeot.gemini.timeout-ms=20000

# 응급실 목록 갱신 주기(밀리초). 기본 6시간.
# 전국 응급의료기관 목록은 신규 개설 및 폐업이 드물어 실시간성이 필요 없다.
# 기동 직후 1회 받아두고 이후 이 주기로 갱신한다.
gyeot.emergency-room.refresh-ms=21600000

# 실시간 가용병상 캐시 유지 시간(밀리초). 기본 3분.
# 원본이 기관마다 1~6분 간격으로 갱신되는 것을 hvidate로 실측했다.
# 이보다 짧게 두면 같은 값을 다시 받아오면서 API 트래픽만 소비한다.
gyeot.emergency-room.beds-ttl-ms=180000
