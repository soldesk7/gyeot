# 테스트(CI) 전용 설정 — `test` 프로필에서만 로드된다(@ActiveProfiles("test")).
#
# 목적: contextLoads 같은 통합 테스트는 스프링 컨텍스트 전체를 띄우므로 외부 API 키를 요구하는 빈(예: Gemini 클라이언트)이 생성 시점에 "키 존재"를 검사
#   실제 키는 application-local.properties에만 있어 CI에는 없으므로 여기에 더미 값을 넣어 빈이 생성되고 컨텍스트가 로드되게 한다.
#
# 이 파일에 실제 값 작성 금지: 테스트는 실제 API를 호출하지 않는다(컨텍스트 로드만 검증)
#   더미 값으로 충분하고, 진짜 키가 아니라서 커밋해도 노출 위험이 없다.
#   실제 호출을 검증하는 테스트가 나중에 필요하면 진짜 키는 레포에 커밋하지 않고
#       로컬 환경변수(application-local.properties)에 주입하여 로컬 테스트 결과만으로 pr 승인하거나
#       CI에서라면 GitHub Secrets로만 주입한다.

spring.ai.google.genai.api-key=test-dummy
spring.ai.google.genai.chat.model=gemini-flash-latest

gyeot.public-data.api-key=test-dummy
